[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "spam"
dynamic = ["version"]
authors = [
  { name="Autumn Muhly", email="amuhly@email.sc.edu" },
]
description = ""
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Lesser General Public License v2 or later (LGPLv2+)",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering"
]

dependencies = [
    "numpy",
    "matplotlib",
    "json",
    "cartopy",
    "obspy",
    "scipy"
]

[project.urls]
Homepage = "https://github.com/autumnmuhly/spam"
Documentation = "https://spam.readthedocs.io"
Repository = "https://github.com/autumnmuhly/spam"
Issues = "https://github.com/autumnmuhly/spam/issues"

[project.scripts]
"spamcalc" = "spam.spamcalc:main"
"spamsummary" = "spam.spamsummary:main"
"spamplot" = "spam.spam_plot:main"
"prepvespa" = "spam.vespa_prepare:main"

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    ]

[tool.hatch.version]
path = "src/spam/__init__.py"
[tool.hatch.build.targets.wheel]
packages = ["src/spam"]
